name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_TURSO_DATABASE_URL: ${{ secrets.VITE_TURSO_DATABASE_URL || 'libsql://academia-fabiovieitas.aws-ap-south-1.turso.io' }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN || 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg4NzM5OTgsImlkIjoiMDFhMDgxMjgtMWQwMS03ZWYxLThiNDgtMTA0MzMzN2Q4NzFmIiwia2lkIjoiekZRMlpBUnYxLVVNR2c1OGNFTWFiWGdkS3J4Y3FoeU9CTUpOVVdHVDBfOCIsInJpZCI6ImI2ODA0MmEwLTc4MzctNGY5MS04MDJlLWI4NjZmMzMwNWRkYyJ9.60uWXwwTuDPCGfNz5KDmw0dMupbRZMLWrdCJA1FULyj8kc1KUu9_kngz1woKCZXMG5vE9WyhV3e_85ebMdfmCQ' }}
          VITE_MEDIA_URL: 'https://fabiovieitas.github.io/academia-assets'
        run: npm run build

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FitLife.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-Android-APK
          path: FitLife.apk
          retention-days: 30
